<text x="998.0" y="592.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">RefPtr&lt;AnimationTimeline&gt; mTimeline</text>
<rect x="408" y="748" width="520" height="240" rx="12" fill="#18281c" stroke="#88ae7a" stroke-width="2"/>
<text x="668.0" y="778.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:600">AnimationTimeline</text>
<path d="M 408 808 H 928" stroke="#88ae7a" stroke-opacity=".6"/>
<text x="668.0" y="838.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">refcnt = 1</text>
<path d="M 408 868 H 928" stroke="#88ae7a" stroke-opacity=".6"/>
<text x="668.0" y="898.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">Array&lt;RefPtr&lt;Animation&gt;&gt; mAnimations</text>
<path d="M 408 928 H 928" stroke="#88ae7a" stroke-opacity=".6"/>
<text x="668.0" y="958.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">LinkedList&lt;Animation&gt; mAnimationOrder</text>
<path d="M 64 1012 H 102" fill="none" stroke="#68efb2" stroke-width="2" stroke-linejoin="round"/>
<text x="118" y="1012" text-anchor="start" dominant-baseline="middle" style="font-size:18px;fill:#b3c8bb;font-weight:400">Retained reference</text>
<path d="M 395 1012 H 433" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linejoin="round"/>
<text x="449" y="1012" text-anchor="start" dominant-baseline="middle" style="font-size:18px;fill:#b3c8bb;font-weight:400">Raw pointer / linked list</text>
<text x="965" y="1012" text-anchor="middle" dominant-baseline="middle" style="font-size:18px;fill:#ff9b8d;font-weight:400">refcnt = 0: freed object</text>
