<path d="M 928 898 H 1260 Q 1282 898 1282 876 V 420 Q 1282 400 1262 400 H 1258" fill="none" stroke="#68efb2" stroke-width="2" stroke-linejoin="round" marker-end="url(#ref)"/>
<path d="M 928 958 H 1290 Q 1312 958 1312 936 V 420 Q 1312 400 1292 400 H 1258" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#raw)"/>
<rect x="32" y="382" width="520" height="240" rx="12" fill="#10281d" stroke="#518564" stroke-width="2"/>
