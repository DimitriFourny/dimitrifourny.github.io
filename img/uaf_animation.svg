<text x="1012" y="88" text-anchor="middle" dominant-baseline="middle" style="font-size:24px;fill:#eff9f2;font-weight:500">JavaScript</text>
<text x="460" y="65" text-anchor="middle" dominant-baseline="middle" class="mono" style="font-size:23px;fill:#eff9f2;font-weight:400">animation1.timeline = null;</text>
<text x="460" y="104" text-anchor="middle" dominant-baseline="middle" class="mono" style="font-size:23px;fill:#eff9f2;font-weight:400">animation1 = null;</text>
<rect x="352" y="186" width="520" height="60" rx="12" fill="#10281d" stroke="#518564" stroke-width="2"/>
<text x="612.0" y="216.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:600">Array&lt;Animation*&gt; animationsToRemove</text>
<path d="M 612 246 V 284 Q 612 306 590 306 H 276 Q 254 306 254 328 V 376" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#raw)"/>
<path d="M 612 246 V 284 Q 612 306 634 306 H 990 Q 1012 306 1012 328 V 376" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#raw)"/>
