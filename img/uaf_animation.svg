<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1040" viewBox="0 0 1344 1040" role="img" aria-labelledby="title description">
<title id="title">Animation use-after-free</title>
<desc id="description">JavaScript clears animation1.timeline and animation1. Animation 1 reaches reference count 0, while Animation 2 has reference count 2 and the timeline has reference count 1. animationsToRemove retains a raw pointer to the freed Animation 1 and a raw pointer to Animation 2.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eff9f2;font-size:23px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#68efb2"/></marker>
<marker id="raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#79c0ff"/></marker>
<marker id="danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#ff9b8d"/></marker>
</defs>
<rect width="1344" height="1040" fill="#0a1810"/>
