<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="964" viewBox="0 0 1344 964" role="img" aria-labelledby="title description">
<title id="title">DocumentTimeline use-after-free</title>
<desc id="description">JavaScript clears both animation timeline references. The animations still have reference count 2, but AnimationTimeline reaches reference count 0. RemoveAnimation is reached through the freed timeline&#x27;s VTable.</desc>
