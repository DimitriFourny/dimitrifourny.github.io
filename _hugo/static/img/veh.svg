<text x="782.0" y="708.0" text-anchor="middle" dominant-baseline="middle" style="font-size:19px;fill:#eff9f2;font-weight:400">PVECTORED_EXCEPTION_HANDLER handler</text>
<rect x="40" y="808" width="490" height="48" rx="12" fill="#18281c" stroke="#88ae7a" stroke-width="2"/>
<text x="285.0" y="832.0" text-anchor="middle" dominant-baseline="middle" style="font-size:20px;fill:#eff9f2;font-weight:600">NtQueryInformationProcess() ⇒ process_cookie</text>
