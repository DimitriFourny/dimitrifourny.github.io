<text x="779" y="810" text-anchor="middle" dominant-baseline="middle" style="font-size:18px;fill:#eff9f2;font-weight:400">XOR + SHIFT</text>
<text x="792" y="899" text-anchor="middle" dominant-baseline="middle" style="font-size:18px;fill:#b3c8bb;font-weight:400">RtlDecodePointer</text>
<text x="792" y="923" text-anchor="middle" dominant-baseline="middle" style="font-size:18px;fill:#b3c8bb;font-weight:400">RtlEncodePointer</text>
<rect x="174" y="954" width="672" height="88" rx="12" fill="#102219" stroke="#294334" stroke-width="2"/>
<text x="192" y="974" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:17px;fill:#eff9f2;font-weight:400">LONG NTAPI VEHHandler(PEXCEPTION_POINTERS ExceptionInfo) {</text>
<text x="212" y="999" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:17px;fill:#68efb2;font-weight:400">return EXCEPTION_CONTINUE_SEARCH;</text>
<text x="192" y="1024" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:17px;fill:#eff9f2;font-weight:400">}</text>
