<text x="832" y="494" text-anchor="middle" dominant-baseline="middle" class="mono" style="font-size:20px;fill:#eff9f2;font-weight:400">RtlpCallVectoredHandlers(</text>
<text x="832" y="522" text-anchor="middle" dominant-baseline="middle" class="mono" style="font-size:20px;fill:#eff9f2;font-weight:400">&amp;RtlpVectored<tspan font-weight="600">Continue</tspan>List)</text>
