<text x="958" y="99" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:18px;fill:#b3c8bb;font-weight:400">ring0</text>
<text x="958" y="136" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:18px;fill:#68efb2;font-weight:400">ring3</text>
<rect x="370" y="140" width="380" height="60" rx="12" fill="#10281d" stroke="#518564" stroke-width="2"/>
<text x="560.0" y="170.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">KiUserExceptionDispatcher</text>
<rect x="370" y="236" width="380" height="60" rx="12" fill="#10281d" stroke="#518564" stroke-width="2"/>
<text x="560.0" y="266.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">RtlDispatchException</text>
