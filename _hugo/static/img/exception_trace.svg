<text x="288.0" y="400.0" text-anchor="middle" dominant-baseline="middle" style="font-size:22px;fill:#eff9f2;font-weight:400">RtlCallVectoredHandlers</text>
<rect x="592" y="370" width="480" height="60" rx="12" fill="#10281d" stroke="#518564" stroke-width="2"/>
