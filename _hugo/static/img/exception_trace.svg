<path d="M 832 428 V 470" fill="none" stroke="#68efb2" stroke-width="2" stroke-linejoin="round" marker-end="url(#ref)"/>
<rect x="370" y="32" width="380" height="60" rx="12" fill="#10281d" stroke="#518564" stroke-width="2"/>
<text x="560.0" y="62.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">KiDispatchException</text>
