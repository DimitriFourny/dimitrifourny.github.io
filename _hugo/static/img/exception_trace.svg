<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="title description">
<title id="title">Windows exception dispatch path</title>
<desc id="description">KiDispatchException in ring0 passes the exception to KiUserExceptionDispatcher in ring3, then RtlDispatchException. The vectored exception path calls RtlCallVectoredHandlers and RtlpCallVectoredHandlers with RtlpVectoredExceptionList. The continue path calls RtlCallVectoredContinueHandlers and RtlpCallVectoredHandlers with RtlpVectoredContinueList.</desc>
