<text x="342.0" y="272.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:600">Animation 1</text>
<path d="M 82 302 H 602" stroke="#518564" stroke-opacity=".6"/>
<text x="342.0" y="332.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">refcnt = 2</text>
<path d="M 82 362 H 602" stroke="#518564" stroke-opacity=".6"/>
<text x="342.0" y="392.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">Animation* mNext</text>
