<path d="M 742 362 H 1262" stroke="#518564" stroke-opacity=".6"/>
<text x="1002.0" y="392.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">Animation* mNext</text>
<path d="M 742 422 H 1262" stroke="#518564" stroke-opacity=".6"/>
<text x="1002.0" y="452.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">RefPtr&lt;AnimationTimeline&gt; mTimeline</text>
<rect x="412" y="602" width="520" height="240" rx="12" fill="#18281c" stroke="#88ae7a" stroke-width="2"/>
<text x="672.0" y="632.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:600">AnimationTimeline</text>
<path d="M 412 662 H 932" stroke="#88ae7a" stroke-opacity=".6"/>
<text x="672.0" y="692.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">refcnt = 2</text>
<path d="M 412 722 H 932" stroke="#88ae7a" stroke-opacity=".6"/>
<text x="672.0" y="752.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">Array&lt;RefPtr&lt;Animation&gt;&gt; mAnimations</text>
<path d="M 412 782 H 932" stroke="#88ae7a" stroke-opacity=".6"/>
<text x="672.0" y="812.0" text-anchor="middle" dominant-baseline="middle" style="font-size:23px;fill:#eff9f2;font-weight:400">LinkedList&lt;Animation&gt; mAnimationOrder</text>
<path d="M 64 890 H 102" fill="none" stroke="#68efb2" stroke-width="2" stroke-linejoin="round"/>
<text x="118" y="890" text-anchor="start" dominant-baseline="middle" style="font-size:18px;fill:#b3c8bb;font-weight:400">Retained reference</text>
<path d="M 395 890 H 433" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linejoin="round"/>
<text x="449" y="890" text-anchor="start" dominant-baseline="middle" style="font-size:18px;fill:#b3c8bb;font-weight:400">Raw pointer / linked list</text>
<text x="965" y="890" text-anchor="middle" dominant-baseline="middle" style="font-size:18px;fill:#ff9b8d;font-weight:400">refcnt = 0: freed object</text>
</svg>
