<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="924" viewBox="0 0 1344 924" role="img" aria-labelledby="title description">
<title id="title">Animation references without use-after-free</title>
<desc id="description">JavaScript retains Animation 1 and Animation 2. Both animations have reference count 2 and retain the timeline, whose reference count is 2. The timeline tracks its animations in mAnimations and mAnimationOrder; mNext is a raw pointer.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eff9f2;font-size:23px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#68efb2"/></marker>
<marker id="raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#79c0ff"/></marker>
<marker id="danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#ff9b8d"/></marker>
</defs>
<rect width="1344" height="924" fill="#0a1810"/>
<ellipse cx="472" cy="88" rx="92" ry="64" fill="#163c2a" stroke="#68efb2" stroke-width="2"/>
<text x="472" y="88" text-anchor="middle" dominant-baseline="middle" style="font-size:24px;fill:#eff9f2;font-weight:500">JavaScript</text>
<text x="598" y="44" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:22px;fill:#eff9f2;font-weight:400">timeline   = new DocumentTimeline();</text>
<text x="598" y="76" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:22px;fill:#eff9f2;font-weight:400">animation1 = new Animation(null, timeline);</text>
<text x="598" y="108" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:22px;fill:#eff9f2;font-weight:400">animation2 = new Animation(null, timeline);</text>
<text x="598" y="140" text-anchor="start" dominant-baseline="middle" class="mono" style="font-size:22px;fill:#eff9f2;font-weight:400">timeline   = null;</text>
